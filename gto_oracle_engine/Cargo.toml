[package]
name = "gto-oracle-engine"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Offline-only heads-up postflop GTO oracle bridge"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
